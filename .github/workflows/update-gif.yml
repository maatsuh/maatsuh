name: Atualizar GIF do README

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gif:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Atualizar v do GIF
        run: |
          python - <<'PY'
          import re
          import time
          from pathlib import Path

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")

          novo_v = int(time.time())

          pattern = r'(https://worlds-qnkl\.onrender\.com/worldinfinite\.gif\?v=)\d+'

          novo_content, quantidade = re.subn(
              pattern,
              rf'\g<1>{novo_v}',
              content
          )

          if quantidade == 0:
              print("URL do GIF não encontrada no README.md")
              raise SystemExit(1)

          readme.write_text(novo_content, encoding="utf-8")

          print(f"GIF atualizado para v={novo_v}")
          PY

      - name: Salvar alteração no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Atualizar versão do GIF"
            git push
          fi
