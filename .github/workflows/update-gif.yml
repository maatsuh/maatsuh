name: Atualizar GIF do README

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gif:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Atualizar v do GIF
        run: |
          python - <<'PY'
          import re
          import time
          from pathlib import Path

          path = Path("readme.md")

          if not path.exists():
              raise SystemExit("readme.md não encontrado!")

          text = path.read_text(encoding="utf-8")

          novo_v = int(time.time())

          pattern = r'(https://worlds-qnkl\.onrender\.com/worldinfinite\.gif\?v=)\d+'

          novo_text, quantidade = re.subn(
              pattern,
              rf'\g<1>{novo_v}',
              text
          )

          if quantidade == 0:
              raise SystemExit(
                  "A URL worldinfinite.gif?v=... não foi encontrada no readme.md"
              )

          path.write_text(novo_text, encoding="utf-8")

          print(f"URL atualizada para v={novo_v}")
          PY

      - name: Commit e Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add readme.md

          if git diff --cached --quiet; then
            echo "Nenhuma alteração."
          else
            git commit -m "Atualizar versão do GIF"
            git push
          fi
