name: Atualizar GIF do README

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gif:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Atualizar versão do GIF
        run: |
          python - <<'PY'
          import re
          import time
          from pathlib import Path

          path = Path("readme.md")

          if not path.exists():
              raise SystemExit("ERRO: readme.md não encontrado!")

          text = path.read_text(encoding="utf-8")

          print("URL encontrada no README:")
          for linha in text.splitlines():
              if "worldinfinite.gif" in linha:
                  print(linha)

          novo_v = int(time.time())

          # Procura worldinfinite.gif?v=QUALQUER_NUMERO
          pattern = r'(worldinfinite\.gif\?v=)\d+'

          novo_text, quantidade = re.subn(
              pattern,
              rf'\g<1>{novo_v}',
              text
          )

          if quantidade == 0:
              raise SystemExit(
                  "ERRO: não encontrei worldinfinite.gif?v=NUMERO no readme.md"
              )

          path.write_text(novo_text, encoding="utf-8")

          print(f"SUCESSO: v atualizado para {novo_v}")
          PY

      - name: Salvar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add readme.md

          if git diff --cached --quiet; then
            echo "Nenhuma alteração."
          else
            git commit -m "Atualizar versão do GIF"
            git push
          fi
